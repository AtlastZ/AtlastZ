<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bpp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff006e">
        <animate attributeName="stop-color" values="#ff006e;#8338ec;#0080ff;#00d4ff;#bf00ff;#ff00aa;#ff006e" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#8338ec">
        <animate attributeName="stop-color" values="#8338ec;#0080ff;#00d4ff;#bf00ff;#ff00aa;#ff006e;#8338ec" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0080ff">
        <animate attributeName="stop-color" values="#0080ff;#00d4ff;#bf00ff;#ff00aa;#ff006e;#8338ec;#0080ff" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="mesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff006e" stop-opacity="0.35">
        <animate attributeName="stop-color" values="#ff006e;#8338ec;#0080ff;#bf00ff;#ff006e" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#8338ec" stop-opacity="0.25">
        <animate attributeName="stop-color" values="#8338ec;#0080ff;#ff00aa;#00d4ff;#8338ec" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0080ff" stop-opacity="0.35">
        <animate attributeName="stop-color" values="#0080ff;#bf00ff;#ff006e;#8338ec;#0080ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="20s" repeatCount="indefinite"/>
    </linearGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#00d4ff" stroke-width="0.4" opacity="0.12"/>
      <path d="M 0 24 L 48 24" fill="none" stroke="#8338ec" stroke-width="0.3" opacity="0.08"/>
    </pattern>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff"/>
    </pattern>

    <filter id="blobBlur">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <rect width="800" height="400" fill="#030308" rx="10"/>
  <rect width="800" height="400" fill="url(#mesh)" rx="10"/>

  <circle cx="120" cy="140" r="110" fill="#ff006e" opacity="0.22" filter="url(#blobBlur)">
    <animate attributeName="cx" values="120;680;400;120" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="140;220;90;140" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="180" r="130" fill="#0080ff" opacity="0.18" filter="url(#blobBlur)">
    <animate attributeName="cx" values="620;180;520;620" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="180;120;260;180" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="300" r="90" fill="#8338ec" opacity="0.16" filter="url(#blobBlur)">
    <animate attributeName="cx" values="400;300;500;400" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="300;180;320;300" dur="7s" repeatCount="indefinite"/>
  </circle>

  <g clip-path="inset(0 round 10px)">
    <rect x="0" y="-48" width="800" height="496" fill="url(#grid)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 48" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g opacity="0.75">
    <circle cx="80" cy="60" r="2" fill="#00d4ff"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="320" r="1.5" fill="#ff00aa"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="80" r="2" fill="#8338ec"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="710" cy="280" r="1.5" fill="#0080ff"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="40" r="1" fill="#bf00ff"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="350" r="2" fill="#ff006e"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <rect width="800" height="400" fill="url(#scan)" opacity="0.04" rx="10"/>
  <rect width="800" height="400" fill="url(#vignette)" rx="10"/>
  <rect x="6" y="6" width="788" height="388" fill="none" stroke="url(#bpp)" stroke-width="2" rx="8" opacity="0.9"/>

  <text x="400" y="108" text-anchor="middle" font-family="Impact, Haettenschweiler, Arial Black, sans-serif" font-size="68" font-weight="900" letter-spacing="6" fill="url(#bpp)" filter="url(#glow)" opacity="0.85">ATL&#923;STZ</text>
  <text x="400" y="108" text-anchor="middle" font-family="Impact, Haettenschweiler, Arial Black, sans-serif" font-size="68" font-weight="900" letter-spacing="6" fill="url(#bpp)">ATL&#923;STZ</text>

  <text x="400" y="142" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" letter-spacing="3" fill="#8338ec">
    <animate attributeName="fill" values="#8338ec;#00d4ff;#ff00aa;#0080ff;#8338ec" dur="5s" repeatCount="indefinite"/>
    &#9670; NEON GAMING MODE - CYBER LOADOUT ACTIVE &#9670;
  </text>

  <text x="400" y="198" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" font-weight="700" fill="#ff006e">
    <animate attributeName="fill" values="#ff006e;#8338ec;#00d4ff;#ff006e" dur="4s" repeatCount="indefinite"/>
    &#9658; PLAYER: Peerapat Sukkasem
  </text>
  <text x="400" y="226" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" font-weight="700" fill="#8338ec">
    <animate attributeName="fill" values="#8338ec;#0080ff;#ff00aa;#8338ec" dur="4s" repeatCount="indefinite"/>
    &#9658; CLASS: Infra | Platform Engineer
  </text>
  <text x="400" y="254" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#00d4ff">
    <animate attributeName="fill" values="#00d4ff;#bf00ff;#ff006e;#00d4ff" dur="4s" repeatCount="indefinite"/>
    &#9658; STATUS: ONLINE - Building the cloud one cluster at a time
  </text>

  <text x="400" y="310" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#bf00ff">
    <animate attributeName="fill" values="#bf00ff;#0080ff;#ff00aa;#bf00ff" dur="3s" repeatCount="indefinite"/>
    &gt; INITIALIZING PLAYER PROFILE... OK
  </text>

  <rect x="200" y="330" width="400" height="4" fill="#1a1a2e" rx="2"/>
  <rect x="200" y="330" width="400" height="4" fill="url(#bpp)" rx="2" opacity="0.9">
    <animate attributeName="width" values="120;400;280;400;120" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="400" y="358" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2" fill="#5e60ce">
    <animate attributeName="fill" values="#5e60ce;#8338ec;#ff00aa;#00d4ff;#5e60ce" dur="5s" repeatCount="indefinite"/>
    SYSTEM BOOT SEQUENCE COMPLETE
  </text>
</svg>
